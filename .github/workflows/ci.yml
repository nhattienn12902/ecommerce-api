name: CI

# Chạy trên push và PR vào main.
# Test chạy cho cả hai; build+push image chỉ chạy khi push thẳng vào main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # nhattienn12902/ecommerce-api

jobs:
  # ===========================================================================
  # JOB 1 — Test + build JAR. Chạy trên MỌI push và PR.
  # ===========================================================================
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven   # cache ~/.m2 tự động theo hash pom.xml

      - name: Run tests and build JAR
        run: ./mvnw clean verify -B

      - name: Upload JAR artifact
        # Chỉ upload khi push vào main — PR không cần build image nên không cần JAR
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ===========================================================================
  # JOB 2 — Build Docker image + push GHCR. CHỈ chạy khi push vào main.
  # ===========================================================================
  docker-push:
    needs: test-and-build           # chỉ chạy nếu job 1 pass
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write               # cần để push lên GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


# ===========================================================================
  # JOB 3 — Deploy lên EC2. CHỈ chạy sau khi docker-push thành công.
  # ===========================================================================
  deploy:
    needs: docker-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            docker compose pull
            docker compose up -d
            docker image prune -f