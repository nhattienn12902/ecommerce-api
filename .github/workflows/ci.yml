name: CI

# Chạy trên push và PR vào main.
# Test chạy cho cả hai; build+push image chỉ chạy khi push thẳng vào main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # nhattienn12902/ecommerce-api

jobs:
  # ===========================================================================
  # JOB 1 — Test + build JAR. Chạy trên MỌI push và PR.
  # ===========================================================================
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and build JAR
        run: ./mvnw clean verify -B

      - name: Upload JAR artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ===========================================================================
  # JOB 2 — Build Docker image + push GHCR. CHỈ chạy khi push vào main.
  # ===========================================================================
  docker-push:
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ===========================================================================
  # JOB 3 — Deploy lên EC2. CHỈ chạy sau khi docker-push thành công.
  # ===========================================================================
  deploy:
    needs: docker-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::881107655832:role/github-actions-deploy-role
          aws-region: us-east-1

      - name: Deploy via SSM Run Command
        run: |
          set -euo pipefail

          INSTANCE_ID=i-0950813f79d0d6b6e

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters '{"commands":["runuser -l ec2-user -c \"cd /home/ec2-user/ecommerce-api && git fetch origin main && git checkout --force ${{ github.sha }} && ./deploy/start.sh\""]}' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $command_id"

          sleep 5

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" || true

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deploy status: $status"

          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          if [ "$status" != "Success" ]; then
            echo "=== STDERR ==="
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text

            echo "Deploy FAILED: $status"
            exit 1
          fi

          echo "Deploy succeeded."
