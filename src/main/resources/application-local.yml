spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: postgres
    password: postgres # local only — never commit production credentials
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: local-dev-only-secret-change-me-min-32-bytes-please-xxxx
  aws:
    s3:
      bucket-name: ecommerce-api-nhattienn-prod
      region: us-east-1
      access-key: REPLACE_WITH_YOUR_ACCESS_KEY
      secret-key: REPLACE_WITH_YOUR_SECRET_KEY
      presigned-url-expiration: 15 # minutes