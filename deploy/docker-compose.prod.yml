services:
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # KHÔNG mở ports ra host — chỉ nội bộ, Grafana query qua network

  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"          # loopback: Nginx vào được, Internet không
    environment:
      GF_SERVER_ROOT_URL: http://52.45.196.58/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  app:
    image: ghcr.io/nhattienn12902/ecommerce-api:latest
    container_name: ecommerce-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://ecommerce-db.cihaouqcce1r.us-east-1.rds.amazonaws.com:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_AWS_S3_ACCESS_KEY: ${APP_AWS_S3_ACCESS_KEY}
      APP_AWS_S3_SECRET_KEY: ${APP_AWS_S3_SECRET_KEY}
      APP_AWS_S3_BUCKET_NAME: ecommerce-api-nhattienn-prod
      APP_AWS_S3_REGION: us-east-1
      APP_AWS_S3_PRESIGNED_URL_EXPIRATION: 15

volumes:
  prometheus-data:
  grafana-data: